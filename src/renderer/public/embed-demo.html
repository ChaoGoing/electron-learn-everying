<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>嵌入演示页 · 子页面</title>
    <!--
      这是「子页面」侧的推荐接法：在 <head> 里同步引入 theme-client.js。
      脚本会立刻读取 URL 上的 ?theme=&palette=，因此首帧就是正确主题，不会闪白。
      id 固定为 __app-theme-client__，宿主据此判断「无需再注入」。
    -->
    <script id="__app-theme-client__" src="./theme-client.js"></script>
    <style>
      /* 子页面自己的一份兜底样式：全部走宿主下发的语义 token，
         所以调色板/明暗一变，这里自动跟着变，无需任何 JS 逻辑。 */
      :root {
        --color-accent: #60a5fa;
        --color-surface-light: #ffffff;
        --color-surface-dark: #2d2d2d;
        --color-mica-light: #f3f3f3;
        --color-mica-dark: #1e1e1e;
        --color-border-light: rgba(0, 0, 0, 0.06);
        --color-border-dark: rgba(255, 255, 255, 0.08);
        --color-text-primary-light: #1a1a1a;
        --color-text-primary-dark: #fafafa;
        --color-text-secondary-light: rgba(0, 0, 0, 0.55);
        --color-text-secondary-dark: rgba(255, 255, 255, 0.55);
        --radius-md: 12px;
        --radius-lg: 16px;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 28px;
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--fg);
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      /* 明暗与调色板都由 theme-client 写在 <html> 上，这里只消费 */
      html[data-theme='light'] body {
        --bg: var(--color-mica-light);
        --fg: var(--color-text-primary-light);
        --fg-dim: var(--color-text-secondary-light);
        --surface: var(--color-surface-light);
        --border: var(--color-border-light);
      }

      html[data-theme='dark'] body {
        --bg: var(--color-mica-dark);
        --fg: var(--color-text-primary-dark);
        --fg-dim: var(--color-text-secondary-dark);
        --surface: var(--color-surface-dark);
        --border: var(--color-border-dark);
      }

      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }

      p {
        margin: 0 0 20px;
        color: var(--fg-dim);
        font-size: 13px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 18px 20px;
        margin-bottom: 14px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 0;
        font-size: 13px;
      }

      .row + .row {
        border-top: 1px solid var(--border);
      }

      .key {
        color: var(--fg-dim);
      }

      .val {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }

      .swatches {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .swatch {
        width: 56px;
        height: 56px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        font-size: 10px;
        padding-bottom: 4px;
        color: var(--fg-dim);
      }

      button {
        font: inherit;
        font-size: 13px;
        padding: 7px 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--fg);
        cursor: pointer;
      }

      button.primary {
        background: var(--color-accent);
        border-color: var(--color-accent);
        color: #fff;
      }

      code {
        background: color-mix(in srgb, var(--fg) 10%, transparent);
        padding: 1px 5px;
        border-radius: 5px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>子页面</h1>
    <p>
      这个页面不包含任何主题切换逻辑，它只是消费宿主下发的 token。切换左上角/设置里的主题，或导航到日记模块换调色板，这里会同步变化。
    </p>

    <div class="card">
      <div class="row"><span class="key">data-theme</span><span class="val" id="v-theme">—</span></div>
      <div class="row"><span class="key">data-palette</span><span class="val" id="v-palette">—</span></div>
      <div class="row"><span class="key">协议版本</span><span class="val" id="v-version">—</span></div>
      <div class="row">
        <span class="key">prefers-color-scheme</span><span class="val" id="v-media">—</span>
      </div>
      <div class="row"><span class="key">收到 token 数</span><span class="val" id="v-tokens">—</span></div>
      <div class="row">
        <span class="key">最后更新</span><span class="val" id="v-updated">—</span>
      </div>
    </div>

    <div class="card">
      <div class="row" style="border: 0; padding-bottom: 10px">
        <span class="key">宿主下发的语义 token</span>
      </div>
      <div class="swatches">
        <div class="swatch" style="background: var(--color-accent)">accent</div>
        <div class="swatch" style="background: var(--surface)">surface</div>
        <div class="swatch" style="background: var(--bg)">mica</div>
      </div>
    </div>

    <div class="card">
      <p style="margin-bottom: 12px">
        子页面也可以主动读取当前快照：<code>window.__APP_THEME__.state</code>
      </p>
      <button class="primary" id="btn-request">重新向宿主请求主题</button>
      <button id="btn-log">打印快照到控制台</button>
    </div>

    <script>
      var theme = window.__APP_THEME__

      function render() {
        var state = theme && theme.state
        document.getElementById('v-theme').textContent = document.documentElement.dataset.theme || '—'
        document.getElementById('v-palette').textContent =
          document.documentElement.dataset.palette || 'default'
        document.getElementById('v-version').textContent = state ? String(state.version) : '等待宿主…'
        document.getElementById('v-media').textContent = window.matchMedia(
          '(prefers-color-scheme: dark)'
        ).matches
          ? 'dark'
          : 'light'
        document.getElementById('v-tokens').textContent = state
          ? String(Object.keys(state.tokens || {}).length)
          : '0'
        document.getElementById('v-updated').textContent = state
          ? new Date(state.updatedAt).toLocaleTimeString()
          : '—'
      }

      if (theme) {
        theme.subscribe(render)
        // subscribe 会立即用已有快照回调一次；未收到快照时再手动渲染一次。
        if (!theme.state) render()
      } else {
        render()
      }

      document.getElementById('btn-request').addEventListener('click', function () {
        if (theme) theme.request()
      })
      document.getElementById('btn-log').addEventListener('click', function () {
        console.log('[embed-demo] theme state =', theme && theme.state)
      })
      window.addEventListener('resize', render)
    </script>
  </body>
</html>
